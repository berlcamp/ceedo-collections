name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup refuses to run when the version
      # is given both in the workflow and as `packageManager` in package.json, and it
      # fails at this step -- before `pnpm install` -- so nothing after it ever executed.
      # package.json's `packageManager: pnpm@10.0.0` is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # An exit criterion for Phase 1, and typecheck does not stand in for it: the Next.js
      # production build is where a bad import boundary, a client/server mistake or a
      # failing page render actually surfaces.
      - run: pnpm build
      # Pinned, not `latest`. db.types.ts is generated output that lives in the repo, and
      # check-types-current.sh regenerates it and diffs. With `latest`, any CLI release
      # that changes the generator's formatting fails that step on a commit that touched
      # nothing -- which is exactly what happened: CI's newer CLI emitted
      # `(X extends {` where the committed file has `X extends {`. Bump this deliberately,
      # and regenerate db.types.ts with the same version in the same commit.
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }
      - run: supabase start
      # Exports API_URL, ANON_KEY, SERVICE_ROLE_KEY and DB_URL, which the test helpers read.
      # The sed is load-bearing: `supabase status -o env` emits KEY="value" with literal
      # double quotes, and $GITHUB_ENV takes the right-hand side verbatim -- so API_URL
      # arrived as "http://127.0.0.1:54321" WITH quotes and supabase-js rejected every
      # client with 'Invalid supabaseUrl', while pg failed resolving a hostname out of the
      # quoted DB_URL. Strips the opening =" and the trailing ".
      - run: supabase status -o env | sed 's/="/=/; s/"$//' >> "$GITHUB_ENV"
      - run: supabase db reset
      - run: ./scripts/check-types-current.sh
      # The Edge Functions are the deployed artifact; typecheck and the SQL suite between
      # them never execute one. Backgrounded because `functions serve` does not return.
      - name: Serve Edge Functions
        run: |
          echo "CEEDO_JWT_SECRET=$JWT_SECRET" > supabase/functions/.env
          supabase functions serve --env-file supabase/functions/.env &
          for i in $(seq 1 30); do
            # Must send the gateway credential AND match our own body. Kong answers 401 for a
            # missing apikey, so polling on the status code alone goes green as soon as the
            # gateway is up -- while the Function may be broken or not serving at all.
            # $API_URL, never a hardcoded port. supabase/config.toml declares this
            # project's non-default ports (api 56321 -- see the README), so the literal
            # 127.0.0.1:54321 that used to be here polled nothing at all and this loop ran
            # its full 60s before failing with "Edge Functions did not become ready" --
            # blaming the Functions for a port. API_URL comes from the `supabase status`
            # step above and follows config.toml wherever it goes next.
            body=$(curl -s -X POST "$API_URL/functions/v1/sync-pull" \
                     -H "apikey: $ANON_KEY" \
                     -H "Authorization: Bearer $ANON_KEY" \
                     -H 'content-type: application/json' -d '{}' || true)
            case "$body" in
              *'"error":"unauthorized"'*) exit 0 ;;
            esac
            sleep 2
          done
          echo "Edge Functions did not become ready" >&2
          exit 1
      - run: pnpm test
