name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup refuses to run when the version
      # is given both in the workflow and as `packageManager` in package.json, and it
      # fails at this step -- before `pnpm install` -- so nothing after it ever executed.
      # package.json's `packageManager: pnpm@10.0.0` is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # An exit criterion for Phase 1, and typecheck does not stand in for it: the Next.js
      # production build is where a bad import boundary, a client/server mistake or a
      # failing page render actually surfaces.
      - run: pnpm build
      # Pinned, not `latest`. db.types.ts is generated output that lives in the repo, and
      # check-types-current.sh regenerates it and diffs. With `latest`, any CLI release
      # that changes the generator's formatting fails that step on a commit that touched
      # nothing -- which is exactly what happened: CI's newer CLI emitted
      # `(X extends {` where the committed file has `X extends {`. Bump this deliberately,
      # and regenerate db.types.ts with the same version in the same commit.
      - uses: supabase/setup-cli@v1
        with: { version: 2.116.0 }
      - run: supabase start
      # Exports API_URL, ANON_KEY and SERVICE_ROLE_KEY, which the test helpers read.
      - run: supabase status -o env >> "$GITHUB_ENV"
      - run: supabase db reset
      - run: ./scripts/check-types-current.sh
      - run: pnpm test
